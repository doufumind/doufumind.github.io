<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>诗歌 | 个人诗歌集</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #faf9f6;
      color: #333;
      font-family: "Songti SC", "Noto Serif SC", "SimSun", serif;
    }

    /* 顶部导航 */
    header {
      padding: 22px 8%;
    }

    header a {
      color: #555;
      text-decoration: none;
      font-size: 15px;
    }

    header a:hover {
      color: #999;
    }

    /* 背景图片区域 */
    .hero {
      min-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image:
        linear-gradient(
          rgba(20, 25, 20, 0.25),
          rgba(20, 25, 20, 0.25)
        ),
        url("./poetry-bg.jpg");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      color: white;
      text-align: center;
    }

    .hero h1 {
      margin: 0 0 18px;
      font-size: 40px;
      font-weight: normal;
      letter-spacing: 12px;
    }

    .hero p {
      margin: 0;
      font-size: 14px;
      letter-spacing: 4px;
    }

    /* 诗歌目录 */
    main {
      max-width: 900px;
      margin: 65px auto 90px;
      padding: 0 24px;
    }

    .section-title {
      margin-bottom: 28px;
      color: #888;
      font-size: 13px;
      letter-spacing: 4px;
    }

    .poem-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .poem-card {
      display: block;
      padding: 30px 25px;
      border: 1px solid #e8e5df;
      background: #fff;
      color: #333;
      text-decoration: none;
      transition: background 0.2s ease;
    }

    .poem-card:hover {
      background: #f0eee8;
    }

    .poem-card h2 {
      margin: 0 0 14px;
      font-size: 19px;
      font-weight: normal;
      line-height: 1.7;
    }

    .poem-card p {
      margin: 0;
      color: #999;
      font-size: 13px;
      line-height: 1.8;
    }

    /* 页面底部 */
    footer {
      padding: 28px 20px;
      border-top: 1px solid #eeeae3;
      color: #aaa;
      text-align: center;
      font-size: 12px;
    }

    /* 手机屏幕适配 */
    @media (max-width: 600px) {
      .hero {
        min-height: 260px;
      }

      .hero h1 {
        font-size: 30px;
        letter-spacing: 8px;
      }

      main {
        margin-top: 45px;
      }

      .poem-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html">← 返回首页</a>
  </header>

  <section class="hero">
    <div>
      <h1>诗歌</h1>
      <p>写写写</p>
    </div>
  </section>

  <main>
    <div class="section-title">POEMS / 诗作</div>

   <div class="poem-list">

  <!-- 第一首 -->
  <a class="poem-card" href="poems/ginkgo.html">
    <h2>银杏叶永不落空</h2>
    <p>2026.10</p>
  </a>


  <!-- 第二首 -->
  <a class="poem-card" href="poems/sunshine.html">
    <h2>在阳光灿烂的日子里</h2>
    <p>2026.10</p>
  </a>


  <!-- 第三首 -->
  <a class="poem-card" href="poems/thin-autumn.html">
    <h2>在一个消瘦的秋天……</h2>
    <p>2026.9</p>
  </a>


  <!-- 第四首 -->
  <a class="poem-card" href="poems/moon.html">
    <h2>认识月亮</h2>
    <p>2026.9</p>
  </a>


</div>
