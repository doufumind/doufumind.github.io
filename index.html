<title>我的诗歌</title>

<style>
body {
    max-width: 700px;
    margin: 80px auto;
    font-family: "Noto Serif SC", serif;
    line-height: 2;
    color: #333;
}

h1 {
    font-weight: normal;
}

.poem {
    margin-top: 50px;
}
</style>

</head>

<body>

<h1>豆腐脑的诗歌</h1>

<p>
水里的火。
</p>


<div class="poem">

<h2>银杏叶永不落空</h2>

<p>
你欣喜地抚摸这些蓝色的树冠<br>
它们曾经老去，如今<br>
又从梦里走出<br>
来到这稍纵即逝的晚秋里
</p>

</div>

</body>
